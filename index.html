<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Thành! ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Playpen+Sans:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

  <audio id="bgMusic"
         src="music/happybirthday.mp3"
         loop
         preload="auto"></audio>

  <div class="background-decor" id="bgDecor"></div>

  <main class="container">

    <!-- MÀN 1: HỘP QUÀ -->
    <section id="step-gift" class="card active">

      <div class="sticker-layer" id="stickers-gift"></div>

      <h1 class="art-title">
        Món quà nho nhỏ<br>
        dành cho Thành
      </h1>
      <div class="gift-wrapper" id="giftBox">
        <img
          src="Pic/birthday_gift.png"
          id="giftImg"
          alt="Hộp quà sinh nhật"
          onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }"
        >
      </div>

    </section>


    <!-- MÀN 2: BÁNH KEM VÀ LỜI CHÚC -->
    <section id="step-cake" class="card hidden">

      <div class="sticker-layer" id="stickers-cake"></div>

      <h1 class="title-birthday">
        Happy Birthday to You! 🎂
      </h1>

      <div class="cake-container">
        <div class="cake-wrapper" id="cakeWrapper" title="Bánh sinh nhật">
    <img
        src="Pic/cake.jpg"
        id="cakeImg"
        alt="Bánh sinh nhật"
    >

    <!-- Hiệu ứng lửa trên 4 đầu nến, ban đầu được ẩn -->
    <div class="candle-flames" id="candleFlames" aria-hidden="true">
        <span class="candle-flame"></span>
        <span class="candle-flame"></span>
        <span class="candle-flame"></span>
        <span class="candle-flame"></span>
    </div>
</div>
          <!-- VÙNG TIẾP XÚC ĐỂ BẮT LỬA CÂY NẾN -->
<button class="btn-candle-action" id="btnCandleAction" type="button">
    🔥 Đốt nến sinh nhật
</button>

      <div class="message-box">
        <p id="typed-text"></p>
        <span class="typing-cursor">|</span>
      </div>

      <button id="btnNext" class="btn-glow">
        Đi nhận quà nào! 🎁
      </button>

    </section>


    <!-- MÀN 3: ALBUM ẢNH KỶ NIỆM -->
    <section id="step-gallery" class="card hidden">

      <div class="sticker-layer" id="stickers-gallery"></div>

      <!-- TRANG TRÍ GÓC TRÊN BÊN TRÁI: HỘP QUÀ & BÓNG BAY -->
      <div class="gallery-top-decor decor-top-left" id="decorTopLeft" title="Chúc mừng sinh nhật!">
        <div class="decor-balloons">
          <div class="decor-balloon b-pink"></div>
          <div class="decor-balloon b-yellow"></div>
          <div class="decor-balloon b-blue"></div>
        </div>
        <img src="Pic/birthday_gift.png" alt="Hộp quà sinh nhật" class="decor-gift-img">
      </div>

      <!-- TRANG TRÍ GÓC TRÊN BÊN PHẢI: BÓNG BAY & HỘP QUÀ -->
      <div class="gallery-top-decor decor-top-right" id="decorTopRight" title="Chúc mừng sinh nhật!">
        <div class="decor-balloons">
          <div class="decor-balloon b-purple"></div>
          <div class="decor-balloon b-coral"></div>
          <div class="decor-balloon b-mint"></div>
        </div>
        <img src="Pic/birthday_gift.png" alt="Hộp quà sinh nhật" class="decor-gift-img">
      </div>

      <h1 class="art-title gallery-title">
        Happy birthday<br>
        to Thành
      </h1>
      <div class="gift-grid" id="giftGrid">

        <!-- QUÀ 1 -->
        <div class="gift-item-box" data-index="1">

          <div class="gift-cover">
            <span class="gift-number">01</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 1"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút kỷ niệm ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_1.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 1"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_1.png'; }">
            <img src="Pic/Gian_khanh_1.png"
                 alt="Gián Khánh 1"
                 class="corner-roach roach-bl"
                 title="Gián Khánh">
          </div>

        </div>


        <!-- QUÀ 2 -->
        <div class="gift-item-box" data-index="2">

          <div class="gift-cover">
            <span class="gift-number">02</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 2"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút dễ thương ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_2.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 2"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_2.png'; }">
            <img src="Pic/Gian_khanh_2.png"
                 alt="Gián Khánh 2"
                 class="corner-roach roach-br"
                 title="Gián Khánh">
          </div>

        </div>


        <!-- QUÀ 3 -->
        <div class="gift-item-box" data-index="3">

          <div class="gift-cover">
            <span class="gift-number">03</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 3"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút niềm vui ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_3.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 3"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_3.png'; }">
            <img src="Pic/Gian_khanh_3.png"
                 alt="Gián Khánh 3"
                 class="corner-roach roach-bl"
                 title="Gián Khánh">
          </div>

        </div>


        <!-- QUÀ 4 -->
        <div class="gift-item-box" data-index="4">

          <div class="gift-cover">
            <span class="gift-number">04</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 4"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút yêu thương ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_4.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 4"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_4.png'; }">
            <img src="Pic/Gian_khanh_4.png"
                 alt="Gián Khánh 4"
                 class="corner-roach roach-br"
                 title="Gián Khánh">
          </div>

        </div>


        <!-- QUÀ 5 -->
        <div class="gift-item-box" data-index="5">

          <div class="gift-cover">
            <span class="gift-number">05</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 5"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút rạng rỡ ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_5.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 5"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_5.png'; }">
            <img src="Pic/Gian_dung_1.png"
                 alt="Gián Dũng 1"
                 class="corner-roach roach-bl"
                 title="Gián Dũng">
          </div>

        </div>


        <!-- QUÀ 6 -->
        <div class="gift-item-box" data-index="6">

          <div class="gift-cover">
            <span class="gift-number">06</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 6"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút ngọt ngào ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_6.jpg"
                 class="main-photo"
                 alt="Kỷ niệm 6"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_6.png'; }">
            <img src="Pic/Gian_dung_2.png"
                 alt="Gián Dũng 2"
                 class="corner-roach roach-br"
                 title="Gián Dũng">
          </div>

        </div>


        <!-- QUÀ 7 -->
        <div class="gift-item-box" data-index="7">

          <div class="gift-cover">
            <span class="gift-number">07</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 7"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Một chút may mắn ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_7.png"
                 class="main-photo"
                 alt="Kỷ niệm 7"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_7.jpg'; }">
            <img src="Pic/Gian_dung_3.png"
                 alt="Gián Dũng 3"
                 class="corner-roach roach-bl"
                 title="Gián Dũng">
          </div>

        </div>


        <!-- QUÀ 8 -->
        <div class="gift-item-box" data-index="8">

          <div class="gift-cover">
            <span class="gift-number">08</span>
            <img src="Pic/birthday_gift.png"
                 alt="Mở hộp quà số 8"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/birthday_gift.gif'; }">
            <span class="gift-caption">Vạn điều hạnh phúc ♡</span>
          </div>

          <div class="photo-card hidden-photo">
            <div class="pin">📌</div>
            <img src="Pic/Thanh_8.png"
                 class="main-photo"
                 alt="Kỷ niệm 8"
                 onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='Pic/Thanh_8.jpg'; }">
            <img src="Pic/Gian_dung_4.png"
                 alt="Gián Dũng 4"
                 class="corner-roach roach-br"
                 title="Gián Dũng">
          </div>

        </div>

      </div>

    </section>

  </main>

<!-- QUE DIÊM LỬA THEO CON TRỎ CHUỘT -->
<div class="matchstick-cursor" id="matchstickCursor">
    <div class="match-body">
        <div class="match-flame">
            <div class="flame-core"></div>
        </div>
        <div class="match-head"></div>
        <div class="match-wood"></div>
    </div>
</div>

<!-- ĐẶT SCRIPT SAU QUE DIÊM ĐỂ JAVASCRIPT NHẬN DIỆN ĐƯỢC -->
<script src="script.js"></script>

</body>
</html>
